<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#F6F5F2" />
    <!--
      Exactly one outside connection, and it is named below.

      `connect-src` allows three community flight-tracking networks and this
      app's own relay, and nothing else. They are where the live aircraft
      positions come from: the app sends a radio callsign, or a point and a
      radius, and gets back positions.

      The relay is there because those networks stopped letting a web page read
      their replies — they still answer, but without the header a browser needs
      before it will hand the data to the page, so the app couldn't see it. The
      relay (see relay/worker.js) asks on the page's behalf from a server, where
      that rule doesn't apply. It is this app's own, it will only fetch the
      handful of URL shapes this app uses, and it carries no more than the
      requests already did: a callsign, or a point on the map.

      The relay is allowed here as `*.workers.dev` rather than by its exact
      address, because Cloudflare hands out the subdomain and it isn't known
      until the relay is created. That is looser than the rest of this policy
      deserves — it permits any address on that shared domain — so **pin it to
      the one address once it exists**. It is a wildcard of convenience, not of
      design.

      Nothing else leaves this page — your flights are stored in this browser
      and are never uploaded, and there is no analytics or font host in the
      policy to send them to.

      `img-src` additionally allows OpenStreetMap's tile server, which draws the
      map itself. Beneath those tiles the app still carries its own coastline
      geometry (src/coastline.ts), so with no connection at all the route is
      still drawn over a recognisable outline — which is the point on a plane,
      where the schedule estimate is all anyone can have anyway.

      `style-src 'unsafe-inline'` is here because React `style={{…}}` props are
      inline style attributes. Styles only; it grants no script execution.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: https://tile.openstreetmap.org;
               connect-src 'self' https://api.adsb.lol https://opendata.adsb.fi https://api.airplanes.live https://*.workers.dev;
               object-src 'none';
               base-uri 'self';
               form-action 'none'"
    />
    <title>Flight Tracker</title>
  </head>
  <body class="bg-[#F6F5F2] text-[#1A1B1D]">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
