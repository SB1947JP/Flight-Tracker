<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#0a0a0a" />
    <!--
      Exactly one outside connection, and it is named below.

      `connect-src` allows three community flight-tracking networks and nothing
      else. They are where the live aircraft positions come from: the app sends
      one a radio callsign and gets back a position, and tries the next if that
      one doesn't answer. Nothing else leaves this page —
      your flights are stored in this browser and are never uploaded, and there
      is no analytics, font host or map tile server in the policy to send them
      to.

      The basemap is still bundled geometry (src/coastline.ts) rather than
      fetched tiles, so everything except the live position keeps working with
      no connection at all — which is the point on a plane, where the schedule
      estimate is all anyone can have anyway.

      `style-src 'unsafe-inline'` is here because React `style={{…}}` props are
      inline style attributes. Styles only; it grants no script execution.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               connect-src 'self' https://api.adsb.lol https://opendata.adsb.fi https://api.airplanes.live;
               object-src 'none';
               base-uri 'self';
               form-action 'none'"
    />
    <title>Flight Tracker</title>
  </head>
  <body class="bg-neutral-950 text-neutral-100">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
